<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sección Sindical CCOO Calsina Carré</title>
<meta name="description" content="Comunicados, convenio y calendario de la Sección Sindical CCOO Calsina Carré">
<meta name="theme-color" content="#d4001a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <img src="logo.png" alt="Logo">
  <div>
    <div class="t1">Sección Sindical CCOO</div>
    <div class="t2">Calsina Carré</div>
  </div>
</header>

<div class="toast" id="toast"></div>

<main>
  <button class="instalar" id="btnInstalar">📲 Instalar en el móvil</button>

  <section class="vista activa" id="v-comunicados">
    <h2>Comunicados</h2>
    <div id="lista-comunicados"><p class="vacio">Cargando…</p></div>
  </section>

  <section class="vista" id="v-convenio">
    <h2>Convenio y documentos</h2>
    <div class="card" id="txt-convenio"></div>
    <div id="lista-documentos"></div>
  </section>

  <section class="vista" id="v-calendario">
    <h2>Calendario</h2>
    <div id="lista-eventos"><p class="vacio">Cargando…</p></div>
  </section>

  <section class="vista" id="v-quienes">
    <h2>Quiénes somos</h2>
    <div class="card" id="txt-quienes"></div>
  </section>

  <section class="vista" id="v-contacto">
    <h2>Contacto</h2>
    <div class="card" id="txt-contacto"></div>
    <a class="pdf" href="mailto:ssccoo.calsinacarre@gmail.com">✉️ Escribir a la Sección Sindical</a>
  </section>

  <footer>
    Web informativa de la Sección Sindical CCOO Calsina Carré.<br>
    No recoge datos personales ni usa cookies de seguimiento.<br>
    <a href="admin.html">Acceso admin</a>
  </footer>
</main>

<nav class="tabs">
  <button data-v="comunicados" class="activa"><span class="ico">📢</span>Comunicados</button>
  <button data-v="convenio"><span class="ico">📄</span>Convenio</button>
  <button data-v="calendario"><span class="ico">📅</span>Calendario</button>
  <button data-v="quienes"><span class="ico">👥</span>Quiénes</button>
  <button data-v="contacto"><span class="ico">✉️</span>Contacto</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// --- Pestañas ---
function irA(v) {
  document.querySelectorAll(".vista").forEach(s => s.classList.toggle("activa", s.id === "v-" + v));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("activa", b.dataset.v === v));
  history.replaceState(null, "", "#" + v);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => irA(b.dataset.v));
if (location.hash) irA(location.hash.slice(1));

// --- Comunicados ---
function tarjetaComunicado(c, nuevo) {
  return `<article class="card ${c.urgente ? "urgente" : ""} ${nuevo ? "nuevo" : ""}">
    <div class="meta">
      ${c.urgente ? '<span class="chip urgente">URGENTE</span>' : ""}
      <span class="chip">${esc(c.categoria)}</span>
      <span>${fechaLarga(c.fecha)}</span>
    </div>
    <h3>${esc(c.titulo)}</h3>
    <div>${textoHTML(c.contenido)}</div>
    ${c.pdf_url ? `<a class="pdf" href="${esc(c.pdf_url)}" target="_blank" rel="noopener">📎 Ver PDF adjunto</a>` : ""}
  </article>`;
}
async function cargarComunicados(idNuevo) {
  const { data, error } = await sb.from("comunicados").select("*").order("fecha", { ascending: false }).limit(100);
  const el = document.getElementById("lista-comunicados");
  if (error) { el.innerHTML = '<p class="vacio">No se han podido cargar los comunicados. Revisa tu conexión.</p>'; return; }
  el.innerHTML = data.length ? data.map(c => tarjetaComunicado(c, c.id === idNuevo)).join("") : '<p class="vacio">Todavía no hay comunicados.</p>';
}

// --- Calendario ---
async function cargarEventos() {
  const { data, error } = await sb.from("eventos").select("*").order("fecha");
  const el = document.getElementById("lista-eventos");
  if (error) { el.innerHTML = '<p class="vacio">No se ha podido cargar el calendario.</p>'; return; }
  const hoy = new Date().toISOString().slice(0, 10);
  const proximos = data.filter(e => e.fecha >= hoy), pasados = data.filter(e => e.fecha < hoy).reverse().slice(0, 5);
  const t = (e, pas) => {
    const d = new Date(e.fecha + "T12:00:00");
    return `<div class="card evento ${pas ? "pasado" : ""}">
      <div class="dia"><b>${d.getDate()}</b><span>${d.toLocaleDateString("es-ES", { month: "short" })}</span></div>
      <div><h3>${esc(e.titulo)}</h3>
        <div class="meta">${e.hora ? "🕒 " + esc(e.hora) : ""} ${e.lugar ? "📍 " + esc(e.lugar) : ""}</div>
        ${e.descripcion ? `<div>${textoHTML(e.descripcion)}</div>` : ""}</div></div>`;
  };
  el.innerHTML = (proximos.length ? proximos.map(e => t(e)).join("") : '<p class="vacio">No hay fechas próximas.</p>')
    + (pasados.length ? '<h3 style="margin-top:24px">Pasados</h3>' + pasados.map(e => t(e, true)).join("") : "");
}

// --- Páginas fijas y documentos ---
async function cargarPaginas() {
  const { data } = await sb.from("paginas").select("*");
  (data || []).forEach(p => { const el = document.getElementById("txt-" + p.slug); if (el) el.innerHTML = textoHTML(p.contenido); });
  const { data: docs } = await sb.from("documentos").select("*").order("fecha", { ascending: false });
  document.getElementById("lista-documentos").innerHTML = (docs || []).map(d =>
    `<div class="card"><h3>${esc(d.titulo)}</h3><div class="meta">${fechaLarga(d.fecha)}</div>
     <a class="pdf" href="${esc(d.url)}" target="_blank" rel="noopener">📄 Abrir PDF</a></div>`).join("");
}

// --- Tiempo real: aviso cuando se publica algo nuevo ---
const toast = document.getElementById("toast");
sb.channel("comunicados-live")
  .on("postgres_changes", { event: "*", schema: "public", table: "comunicados" }, (p) => {
    cargarComunicados(p.new?.id);
    if (p.eventType === "INSERT") {
      toast.textContent = "🔔 Nuevo comunicado: " + (p.new.titulo || "");
      toast.classList.add("ver");
      toast.onclick = () => { irA("comunicados"); toast.classList.remove("ver"); };
      setTimeout(() => toast.classList.remove("ver"), 8000);
    }
  }).subscribe();
// al volver a abrir la app, refrescar
document.addEventListener("visibilitychange", () => { if (!document.hidden) { cargarComunicados(); cargarEventos(); } });

cargarComunicados(); cargarEventos(); cargarPaginas();

// --- Instalar como app ---
let promptInstalar;
const btnInst = document.getElementById("btnInstalar");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; btnInst.style.display = "block"; });
btnInst.onclick = async () => { if (promptInstalar) { promptInstalar.prompt(); await promptInstalar.userChoice; btnInst.style.display = "none"; } };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
