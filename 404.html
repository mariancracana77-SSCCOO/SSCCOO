<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15191E">
<title>Página no encontrada · CCOO Calsina Carré</title>
<!-- Página de error de GitHub Pages: sale con cualquier dirección que no existe (un enlace mal copiado o cortado).
     Puede salir en cualquier carpeta, por eso todas las rutas empiezan por /SSCCOO/. -->
<link rel="icon" type="image/png" sizes="32x32" href="/SSCCOO/favicon-32.png">
<link rel="stylesheet" href="/SSCCOO/fuentes.css">
<style>
  :root { --fondo: #F5F3EE; --texto: #15191E; --suave: #4A525C; --caja: #fff; --borde: #DDD8CE; --rojo: #AB1012; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #0F1216; --texto: #F5F3EE; --suave: #B9C0C8; --caja: #1C2128; --borde: #2E353E; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); color: var(--texto);
    font: 1.125rem/1.55 "Atkinson Hyperlegible", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); background: #15191E; color: #fff; border-bottom: 4px solid var(--rojo); }
  header img { width: 44px; height: 44px; }
  header b { font: 700 1.35rem/1.1 "Barlow Condensed", system-ui, sans-serif; letter-spacing: .02em; display: block; }
  header small { font-size: .85rem; color: #C9CFD6; }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .caja { background: var(--caja); border: 1px solid var(--borde); border-top: 6px solid var(--rojo); border-radius: 14px; padding: 24px 20px; }
  h1 { margin: 0 0 10px; font: 700 2rem/1.1 "Barlow Condensed", system-ui, sans-serif; }
  p { margin: 0 0 14px; color: var(--suave); }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  a.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 20px; border-radius: 10px;
    font-weight: 700; text-decoration: none; border: 2px solid var(--rojo); }
  a.principal { background: var(--rojo); color: #fff; }
  a.secundario { color: var(--texto); }
  a.boton:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
</style>
</head>
<body>
<header>
  <img src="/SSCCOO/logo.png" alt="" width="44" height="44">
  <div><b>CCOO Calsina Carré</b><small>Sección Sindical</small></div>
</header>
<main>
  <div class="caja">
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal copiado o cortado, o que lo que buscabas se haya movido.</p>
    <p>Entra en la web y búscalo desde allí.</p>
    <div class="botones">
      <a class="boton principal" href="/SSCCOO/">Ir al inicio</a>
      <a class="boton secundario" href="/SSCCOO/#buscar">Buscar en la web</a>
    </div>
  </div>
</main>
</body>
</html>
