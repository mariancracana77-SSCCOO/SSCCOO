      <rect x="-9.5" y="-30.5" width="4.4" height="14" rx="2.2" transform="rotate(-9 -7 -17)"/>
      <rect x="-4.7" y="-33.5" width="4.5" height="17" rx="2.25" transform="rotate(-3 -2.5 -17)"/>
      <rect x="0.4" y="-33" width="4.5" height="16.5" rx="2.25" transform="rotate(3 2.6 -17)"/>
      <rect x="5.2" y="-29.5" width="4.2" height="13" rx="2.1" transform="rotate(10 7.3 -17)"/>
      <rect x="-15.8" y="-17" width="4.8" height="13" rx="2.4" transform="rotate(-48 -13 -6)"/>
     </g>
     <path d="M-5 -4C-5.5 -9 -5 -13 -4 -16" stroke="#fff" stroke-opacity=".35" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
   </g>
  </g>
  <rect id="brillo" x="-90" y="10" width="70" height="300" fill="url(#gBrillo)" transform="skewX(-20)" clip-path="url(#cCamion)" opacity="0"/>
 </g>
</g></svg>
<div id="vig"></div>
<div id="logo"><img src="../icon-512.png" alt=""></div>
<svg id="aro" viewBox="0 0 100 100"><circle id="aroC" cx="50" cy="50" r="49" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
<div id="nombre">CCOO Calsina Carré</div>
</div>
<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const W=innerWidth,H=innerHeight;
const suave=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const lerp=(a,b,x)=>a+(b-a)*x;
function el(tag,at,pad){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(pad)pad.appendChild(e);return e}
// ruedas
function rueda(g,cx,cy){
 const r=el("g",{transform:`translate(${cx} ${cy})`},g), giro=el("g",{},r);
 el("circle",{r:44.5,fill:"url(#gNeumA)",stroke:"#0E2C55","stroke-width":3},giro);
 const det=el("g",{},giro);
 for(let i=0;i<5;i++){const a=i/5*360;el("circle",{cx:11.5,cy:0,r:2.9,fill:"#7D8B9B",transform:`rotate(${a})`},det)}
 const bor=el("g",{opacity:0},giro);
 for(let i=0;i<5;i++){const a=i/5*360;el("path",{d:"M4 -2A20 20 0 0 1 20 -5L18 -1Z",fill:"#fff","fill-opacity":.45,transform:`rotate(${a})`},bor)}
 el("circle",{r:20,fill:"url(#gBuje)",stroke:"#EEF2F6","stroke-width":2.5,"fill-opacity":1},r).setAttribute("class","hub");
 giro.appendChild(det); 
 return {giro,det,bor,hub:r.lastChild};
}
const ruedas=[rueda($("r1"),123,306),rueda($("r2"),280,307.5),rueda($("r3"),585,308)];
// fondo: edificios lejanos en dos capas
function ciudad(g,sem,min,max,fill,P){let x=0,s=sem;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
 while(x<P){const w=40+rnd()*90,h=min+rnd()*(max-min);el("rect",{x,y:358-h,width:w,height:h+2,fill,rx:3},g);
  if(rnd()>.55)el("rect",{x:x+w*.3,y:358-h-18,width:w*.35,height:20,fill,rx:2},g);x+=w+(rnd()<.3?30:2)}}
const PA=1500,PB=1700;
const A=[0,1,2].map(i=>{const g=el("g",{},$("skyA"));ciudad(g,12345,40,150,"url(#gSkyA)",PA);return g});
const B=[0,1,2].map(i=>{const g=el("g",{},$("skyB"));ciudad(g,777,90,260,"url(#gSkyB)",PB);return g});
// recorrido de la carretera (integral de la velocidad)
const VEL=t=>1300*(1-suave(2.0,2.65,t)*.999);
const TAB=[0];for(let i=1;i<=500;i++)TAB.push(TAB[i-1]+VEL((i-.5)*.01)*.01);
const dist=t=>{const x=Math.max(0,Math.min(4.99,t))*100,i=Math.floor(x);return TAB[i]+(TAB[i+1]-TAB[i])*(x-i)};
// cabeza del conductor
const perfil=document.querySelector("#chofer .bv-perfil"),frente=document.querySelector("#chofer .bv-frente"),ojos=document.querySelector("#chofer .bv-ojos"),cabeza=document.querySelector("#chofer .bv-cabeza");
[perfil,frente,ojos].forEach(e=>{e.style.transformBox="fill-box";e.style.transformOrigin="50% 60%"});
cabeza.style.transformBox="view-box";cabeza.style.transformOrigin="71px 80px";
const FOCO_A=[575,160],FOCO_B=[350,179],DURA=2.9;
// destino: dónde acaba el camión (centro del camión del logo)
const LOGO=240,lx=(W-LOGO)/2,ly=(H-(LOGO+22+27+22+5))/2;
const FIN=[lx+LOGO*.548,ly+LOGO*.527], S1=LOGO*.50049/700;
const S0=Math.min(W,H*.5)*.0034;
function frame(t){
 const x=Math.min(1,t/DURA),u=x*x*(3-2*x)*.6+(1-Math.pow(1-x,2))*.4;
 const s=S0*Math.pow(S1/S0,u), g=1-u;
 const fa=suave(0,.9,u), Fx=lerp(FOCO_A[0],FOCO_B[0],fa), Fy=lerp(FOCO_A[1],FOCO_B[1],fa);
 const Ax=lerp(W/2,FIN[0],suave(0,1,u)), Ay=lerp(H*.42,FIN[1],suave(0,1,u));
 const roll=-3.5*g*g;
 $("cam").setAttribute("transform",`translate(${Ax} ${Ay}) rotate(${roll}) scale(${s}) translate(${-Fx} ${-Fy})`);
 const d=dist(t),v=VEL(t),fade=1-suave(1.7,2.5,t);
 // fondo: desenfocado mientras estamos cerca (profundidad de campo), se funde al final
 const desf=Math.max(0,5*g*g+1.2*(1-suave(0,1.5,t)))/Math.max(.35,s*.55);
 $("fDesenfG").setAttribute("stdDeviation",(desf*s*1.4).toFixed(2)); 
 B.forEach((e,i)=>e.setAttribute("transform",`translate(${(i-1)*PB-((d*.07)%PB)} 0)`));
 A.forEach((e,i)=>e.setAttribute("transform",`translate(${(i-1)*PA-((d*.18)%PA)} 0)`));
 $("lejos").setAttribute("opacity",fade);
 $("calle").setAttribute("opacity",lerp(1,0,suave(1.7,2.55,t)));
 $("rayas").setAttribute("fill","url(#pRaya)");
 document.getElementById("pRaya").setAttribute("patternTransform",`translate(${-(d%260)} 0)`);
 // suspensión y frenazo
 const bote=Math.sin(t*15)*2.6*(1-suave(2.0,2.6,t));
 const cab=Math.sin(Math.PI*suave(2.35,2.9,t))*1.1;
 $("camion").setAttribute("transform",`translate(0 ${bote}) rotate(${cab} 350 358)`);
 $("sombra").setAttribute("opacity",(.9-Math.abs(bote)*.03)*(1-suave(2.3,2.9,t)));
 // ruedas: con la velocidad se ven borrosas, al frenar se ven las tuercas
 const sp=Math.min(1,v/700);
 const ropa=1-suave(2.75,2.9,t);ruedas.forEach(r=>{r.giro.parentNode.setAttribute("opacity",ropa);r.giro.setAttribute("transform",`rotate(${(d/44.5*180/Math.PI)%360})`);r.det.setAttribute("opacity",1-sp*.85);r.bor.setAttribute("opacity",sp*.9)});
 // brillo que cruza el camión una vez
 const bb=suave(1.5,2.2,t);$("brillo").setAttribute("opacity",bb>0&&bb<1?1:0);$("brillo").setAttribute("transform",`translate(${lerp(-60,760,bb)} 0) skewX(-20)`);
 // conductor
 const per=suave(.45,.9,t);perfil.style.opacity=1-per;perfil.style.transform=`translateX(${-6*per}%) scaleX(${1-.18*per})`;
 frente.style.opacity=per;frente.style.transform=`translateX(${8*(1-per)}%) scaleX(${.82+.18*per})`;
 cabeza.style.transform=`rotate(${-6*Math.sin(Math.PI*suave(1.0,1.6,t))}deg)`;
 ojos.style.transform=`scaleY(${(t>1.75&&t<1.93)?.1:1})`;
 // saludo
 const sube=suave(.5,1.0,t),baja=suave(1.95,2.2,t);
 const gate=suave(1.0,1.15,t)*(1-suave(1.8,2.0,t));
 const ola=Math.sin((t-1.0)*9)*6*gate, mano=Math.sin((t-1.0)*9+.8)*22*gate;
 const ang=lerp(188,354,sube)+baja*194+ola; // sube y baja por fuera (hacia atrás), sin cruzar la cara
 $("antebrazo").setAttribute("transform",`rotate(${ang})`);
 $("mano").setAttribute("transform",`translate(0 -50) rotate(${mano})`);
 const ret=suave(1.9,2.2,t);$("brazo").setAttribute("transform",`translate(${9*ret} ${-2*ret})`);$("brazo").setAttribute("opacity",1-ret);
 $("cristal").setAttribute("transform",`translate(0 ${(1-suave(1.95,2.3,t))*76})`);
 // el camión se funde y sale el logo
 const fc=1-suave(3.35,3.9,t);$("camion").style.opacity=fc;$("cam").style.opacity=1;
 const lo=suave(3.35,3.6,t),r=lerp(8,100,suave(3.35,4.55,t));
 const logo=$("logo");logo.style.left=lx+"px";logo.style.top=ly+"px";logo.style.opacity=lo;
 const m=`radial-gradient(circle at 54.8% 52.7%,#000 ${r-22}%,transparent ${r}%)`;logo.style.webkitMask=logo.style.mask=m;
 const sello=t<3.25?1:1-.07*Math.sin(Math.PI*Math.min(1,(t-3.25)/1.1));logo.style.transform=`scale(${sello})`;
 const aro=$("aro");aro.style.left=(lx-5)+"px";aro.style.top=(ly-5)+"px";
 $("aroC").setAttribute("stroke-dashoffset",100-100*suave(2.9,3.7,t));aro.style.opacity=suave(2.9,3.0,t)*(1-suave(3.85,4.35,t));
 const nm=$("nombre");nm.style.top=(ly+LOGO+22)+"px";nm.style.opacity=suave(3.75,4.35,t);
}
const q=new URLSearchParams(location.search);
if(q.has("t")){frame(+q.get("t"))}
else{let t0=null;const run=n=>{if(t0==null)t0=n;const t=(n-t0)/1000;frame(Math.min(t,4.7));if(t<4.8)requestAnimationFrame(run)};requestAnimationFrame(run)}
window.frame=frame;
</script></body></html>
